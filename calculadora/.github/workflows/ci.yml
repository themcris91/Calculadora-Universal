name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.64 # TODO: confirmar versión a fijar
    steps:
      - uses: actions/checkout@v4
      - run: ./engine-c/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: |
            web/public/wasm
            engine-c/build/test

  test-node:
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: .
      - name: Unit test C (nativo)
        run: |
          cc -std=c99 -Wall -Wextra -Werror engine-c/src/api.c engine-c/src/print.c engine-c/tests/test_sumar.c -lm -o /tmp/test_sumar
          /tmp/test_sumar
      - run: npm install
      - run: npm test
      - run: cd web && npm install && npm run build
