name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.64
    steps:
      - uses: actions/checkout@v4
      - run: ./engine-c/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: |
            web/public/wasm
            engine-c/build/test

  test-node:
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: .
      - name: Unit tests C (nativo, Unity)
        run: ./engine-c/test.sh
      - run: npm install
      - run: npm test
      - run: npm run build -w web
